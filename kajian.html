<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jadwal Kajian Ummahat POSKU Makassar</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background:#f8fafc;
}
</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="bg-white shadow sticky top-0 z-50">

<div class="max-w-6xl mx-auto px-5">

<div class="flex justify-between items-center h-16">

<h1 class="font-bold text-xl text-[#F5278B]">
Ummahat POSKU
</h1>

<div class="space-x-8 font-medium">

<a href="index.html" class="hover:text-[#F5278B]">
Beranda
</a>

<a href="kajian.html" class="text-[#F5278B] font-bold">
Kajian
</a>

<a href="tentang.html" class="hover:text-[#F5278B]">
Tentang
</a>

</div>

</div>

</div>

</nav>

<!-- HEADER -->

<section class="py-14 bg-[#F5278B] text-white">

<div class="max-w-6xl mx-auto px-5">

<h2 class="text-4xl font-bold">
Jadwal Kajian Ummahat POSKU Makassar
</h2>

<p class="mt-3 opacity-90">
InsyaAllah dilaksanakan satu kali setiap bulan.
</p>

</div>

</section>

<!-- DATA -->

<section class="py-14">

<div class="max-w-5xl mx-auto px-5">

<!-- Tombol Bulan -->
<div id="bulanTabs"
     class="flex flex-wrap justify-center gap-3 mb-10">
</div>

<!-- Isi Kajian -->
<div id="jadwal"></div>

</div>

</section>

<footer class="bg-gray-900 text-white py-8 text-center">

© 2026 Ummahat POSKU Makassar

</footer>

<script>

const API="https://script.google.com/macros/s/AKfycbzOF4h1N0ccOTLSYUFiXZoeElvIiKDuGCUWHj_CAs7ygMciiV1wYr5-ha57rCOiUffy/exec?sheet=bulan";

let semuaData = [];

const bulanNama = [
"Januari","Februari","Maret","April","Mei","Juni",
"Juli","Agustus","September","Oktober","November","Desember"
];

const hariNama = [
"Ahad","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"
];

async function loadKajian(){

    const response = await fetch(API);
    semuaData = await response.json();

    buatTab();

}

function buatTab(){

    const tabs = document.getElementById("bulanTabs");

    tabs.innerHTML="";

    semuaData.forEach((item,index)=>{

        tabs.innerHTML += `
            <button
                id="btn${index}"
                onclick="tampil(${index})"
                class="px-5 py-2 rounded-full border border-[#F5278B] hover:bg-[#F5278B] hover:text-white">

                ${item.Bulan}

            </button>
        `;

    });

    tampil(0);

}

function tampil(index){

    document.querySelectorAll("#bulanTabs button").forEach(btn=>{

        btn.classList.remove("bg-[#F5278B]","text-white");

    });

    document.getElementById("btn"+index)
    .classList.add("bg-[#F5278B]","text-white");

    const item = semuaData[index];

    const tgl = new Date(item.Tanggal);

    const tanggal =
    `${hariNama[tgl.getDay()]}, ${tgl.getDate()} ${bulanNama[tgl.getMonth()]} ${tgl.getFullYear()}`;

    document.getElementById("jadwal").innerHTML=`

<div class="bg-white rounded-3xl shadow-lg p-8">

<h2 class="text-3xl font-bold text-[#F5278B] mb-6">

${item.Bulan}

</h2>

<p class="mb-3">
📅 <b>${tanggal}</b>
</p>

<p class="mb-3">
🕘 ${item.Jam}
</p>

<p class="mb-3">
👤 ${item.Pemateri}
</p>

<p class="mb-3">
📍 ${item.Lokasi}
</p>

<p class="mb-6">
📝 ${item.Keterangan}
</p>

<a href="${item.Maps}"

target="_blank"

class="bg-[#F5278B] text-white px-6 py-3 rounded-xl">

📍 Lihat Lokasi

</a>

</div>

`;

}

loadKajian();

</script>

</body>
</html>
